function transcriptLines(manuscript) {
  const pitch = manuscript.pitch
  const sentences = splitSentences(pitch.transcript || PITCH_TEMPLATES[0].script)
  const totalWords = sentences.reduce((sum, sentence) => sum + wordCount(sentence), 0) || 1
  let elapsed = 0
  return sentences.map((sentence) => {
    const start = elapsed
    elapsed += (wordCount(sentence) / totalWords) * pitch.durationSec
    return { start: Math.round(start), end: elapsed, text: sentence.trim() }
  })
}

function splitSentences(text) {
  return String(text).replace(/\s+/g, ' ').replace(/([.!?])\s+(?=\S)/g, '$1\n').split('\n').map((sentence) => sentence.trim()).filter(Boolean)
}

function slideAt(manuscript, time) {
  const pitch = manuscript.pitch
  if (!pitch.slides?.length) return -1
  if (pitch.slideMarks?.length) return pitch.slideMarks.filter((mark) => mark.atSec <= time).at(-1)?.slide ?? 0
  return Math.min(pitch.slides.length - 1, Math.floor((time / pitch.durationSec) * pitch.slides.length))
}

function drawPlayerFrame(manuscript) {
  const canvas = document.getElementById('player-canvas')
  if (!canvas) return
  const context = canvas.getContext('2d')
  const pitch = manuscript.pitch
  const isDoubleBlind = manuscript.reviewModel === 'double-blind' && currentView().id !== 'published-article'
  const showingOriginal = playerShowsOriginal(manuscript)
  const time = player.manuscriptId === manuscript.id ? player.time : 0
  const level = player.isPlaying && player.manuscriptId === manuscript.id ? 0.35 + Math.abs(Math.sin(performance.now() / 160)) * 0.4 : 0.1
  const slideIndex = slideAt(manuscript, time)
  context.fillStyle = cssValue('--stage-bg')
  context.fillRect(0, 0, SCENE_WIDTH, SCENE_HEIGHT)
  const presenterColor = showingOriginal ? '#6b7280' : NEUTRAL_AVATAR_COLOR
  if (slideIndex >= 0) {
    drawSlide(context, pitch.slides[slideIndex], slideIndex, pitch.slides.length, 40, 40, 1200, 640)
    if (pitch.source !== 'script') {
      context.save()
      context.beginPath()
      context.arc(1112, 572, 118, 0, Math.PI * 2)
      context.fillStyle = '#ffffff'
      context.fill()
      context.beginPath()
      context.arc(1112, 572, 112, 0, Math.PI * 2)
      context.clip()
      context.fillStyle = cssValue('--stage-panel')
      context.fillRect(1000, 460, 224, 224)
      drawAvatar(context, 1112, 572, 80, level, presenterColor)
      context.restore()
    }
  } else {
    drawAvatar(context, SCENE_WIDTH / 2, SCENE_HEIGHT / 2, 160, level, presenterColor)
  }
  if (showingOriginal && isDoubleBlind) {
    context.fillStyle = 'rgba(17, 24, 39, 0.66)'
    context.beginPath()
    context.roundRect(40, 40, 330, 44, 22)
    context.fill()
    context.fillStyle = '#ffffff'
    context.font = '600 20px Inter, sans-serif'
    context.fillText('Original · real face and voice', 62, 69)
  }
  const caption = document.getElementById('player-caption')
  if (caption) {
    const line = transcriptLines(manuscript).filter((item) => item.start <= time).at(-1)
    caption.textContent = editorUi.showCaptions && (player.isPlaying || time > 0) ? line?.text ?? '' : ''
  }
  const timeLabel = document.getElementById('player-time')
  if (timeLabel) timeLabel.textContent = `${formatSeconds(time)} / ${formatSeconds(pitch.durationSec)}`
  const seek = document.getElementById('player-seek')
  if (seek && document.activeElement !== seek) seek.value = Math.floor(time)
  const transcript = document.getElementById('transcript')
  if (transcript) {
    const lines = transcriptLines(manuscript)
    const activeIndex = lines.findLastIndex((item) => item.start <= time)
    transcript.querySelectorAll('button').forEach((button, index) => button.setAttribute('aria-current', String(player.manuscriptId === manuscript.id && (player.isPlaying || time > 0) && index === activeIndex)))
  }
}

function runPlayer() {
  cancelAnimationFrame(player.animationId)
  const tick = (timestamp) => {
    const manuscript = findManuscript(player.manuscriptId)
    if (!manuscript?.pitch || !document.getElementById('player-canvas')) return
    if (player.isPlaying) {
      player.time += (timestamp - (player.lastTimestamp || timestamp)) / 1000
      player.lastTimestamp = timestamp
      if (player.time >= manuscript.pitch.durationSec) {
        player.time = manuscript.pitch.durationSec
        player.isPlaying = false
        updatePlayButton()
      }
    }
    drawPlayerFrame(manuscript)
    if (player.isPlaying) player.animationId = requestAnimationFrame(tick)
  }
  player.lastTimestamp = 0
  player.animationId = requestAnimationFrame(tick)
}

function updatePlayButton() {
  const button = document.getElementById('play-button')
  if (!button) return
  button.innerHTML = `${icon(player.isPlaying ? 'pause' : 'play')}${player.isPlaying ? 'Pause' : 'Play'}`

async function openNoteCamera() {
  noteRecorder.error = null
  try {
    noteRecorder.stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true })
  } catch {
    noteRecorder.error = 'Camera unavailable here. Send a text note instead.'
  }
  rerenderModalKeepingText()
}

function startNoteRecording() {
  const mimeType = pickMimeType()
  const recorder = new MediaRecorder(noteRecorder.stream, mimeType ? { mimeType } : undefined)
  noteRecorder.recorder = recorder
  noteRecorder.chunks = []
  recorder.ondataavailable = (event) => { if (event.data.size) noteRecorder.chunks.push(event.data) }
  recorder.onstop = () => {
    noteRecorder.blob = new Blob(noteRecorder.chunks, { type: recorder.mimeType })
    noteRecorder.url = URL.createObjectURL(noteRecorder.blob)
    stopNoteStream()
    rerenderModalKeepingText()
  }
  recorder.start()
  noteRecorder.isRecording = true
  noteRecorder.startedAt = Date.now()
  rerenderModalKeepingText()
  noteRecorder.timerId = setInterval(() => {
    const elapsed = (Date.now() - noteRecorder.startedAt) / 1000
    const timer = document.getElementById('note-timer')
    if (timer) timer.textContent = formatSeconds(elapsed)
    if (elapsed >= appState.settings.limits.editorNoteSeconds) stopNoteRecording()
  }, TIMER_TICK_MS)
}

function stopNoteRecording() {
  clearInterval(noteRecorder.timerId)
  noteRecorder.durationSec = Math.round((Date.now() - noteRecorder.startedAt) / 1000)
  noteRecorder.isRecording = false
  if (noteRecorder.recorder?.state === 'recording') noteRecorder.recorder.stop()
}

function stopNoteStream() {
  noteRecorder.stream?.getTracks().forEach((track) => track.stop())
  noteRecorder.stream = null
}

function resetNoteRecorder() {
  clearInterval(noteRecorder.timerId)
  stopNoteStream()
  if (noteRecorder.url) URL.revokeObjectURL(noteRecorder.url)
  Object.assign(noteRecorder, { recorder: null, chunks: [], blob: null, url: null, durationSec: 0, isRecording: false, error: null })
}

async function confirmDecision() {
  const manuscript = findManuscript(editorUi.selectedId)
  const type = editorUi.decisionType
  const settings = appState.settings
  const now = new Date().toISOString()
  const hasVideo = Boolean(noteRecorder.blob)
  const note = type === 'accepted' ? null : { text: editorUi.noteText.trim(), hasVideo, durationSec: noteRecorder.durationSec, at: now }
  const events = {
    accepted: 'Accepted for review',
    repitch: `Re-pitch requested · due ${formatDate(addDays(now, settings.repitch.deadlineDays))}`,
    rejected: 'Desk rejected',
  }
  const updated = {
    ...manuscript,
    decision: type,
    decidedAt: now,
    editorNote: note ?? manuscript.editorNote,
    repitchCount: type === 'repitch' ? manuscript.repitchCount + 1 : manuscript.repitchCount,
    repitchDeadline: type === 'repitch' ? addDays(now, settings.repitch.deadlineDays) : manuscript.repitchDeadline ?? null,
    history: [...manuscript.history, { at: now, event: `${events[type]}${hasVideo ? ' (with video note)' : note?.text ? ' (with note)' : ''}` }],
  }
  try {
    await saveManuscript(updated)
  } catch {
    showToast('Could not save the decision. Check your access and try again.', 'alert-circle')
    return
  }
  if (hasVideo) await mediaDb.put(`editor-note:${manuscript.id}`, { blob: noteRecorder.blob, savedAt: now })
  resetNoteRecorder()
  closeModal()
  render()
  showToast({ accepted: 'Accepted for review', repitch: 'Re-pitch request sent to the author', rejected: 'Desk rejection sent to the author' }[type])
  if (type === 'accepted') openDrawer()
}

function renderClip(key, limitSec, { isAudioOnly = false, label = 'Record a video' } = {}) {
  const isActive = clip.key === key
  if (isActive && clip.url) {
    return `
      <div class="clip">
        ${clip.blob?.type?.startsWith('audio') ? `<audio src="${clip.url}" controls></audio>` : `<video src="${clip.url}" controls playsinline></video>`}
        <div class="stack-sm">
          <strong style="color:var(--heading)">Recording ready${clip.durationSec ? ` · ${formatSeconds(clip.durationSec)}` : ''}</strong>
          <button type="button" class="btn btn-ghost btn-sm" data-action="clip-reset" style="align-self:flex-start">${icon('rotate-ccw')}Remove and record again</button>
        </div>
      </div>`
  }
  if (isActive && clip.stream) {
    return `
      <div class="clip">
        ${clip.isAudioOnly ? `<div class="clip-audio">${icon('mic')}</div>` : '<video id="clip-live" autoplay muted playsinline style="transform:scaleX(-1)"></video>'}
        <div class="stack-sm">
          <span class="timer">${clip.isRecording ? '<span class="rec-dot" style="display:inline-block;margin-right:6px"></span>' : ''}<span id="clip-timer">0:00</span> / ${formatSeconds(limitSec)}</span>
          ${clip.isRecording ? `<button type="button" class="btn btn-record btn-sm" data-action="clip-stop" style="align-self:flex-start">${icon('square')}Stop</button>` : `<button type="button" class="btn btn-record btn-sm" data-action="clip-start" style="align-self:flex-start">${icon('circle')}Start recording</button>`}
          <button type="button" class="btn btn-ghost btn-sm" data-action="clip-cancel" style="align-self:flex-start" ${clip.isRecording ? 'disabled' : ''}>Cancel</button>
        </div>
      </div>`
  }
  return `
    <div class="row">
      <button type="button" class="btn btn-secondary btn-sm" data-action="clip-open" data-key="${key}" data-limit="${limitSec}" data-audio="${isAudioOnly}">${icon(isAudioOnly ? 'mic' : 'video')}${label}</button>
      ${isActive && clip.error ? `<span class="field-hint">${escapeHtml(clip.error)}</span>` : ''}
    </div>`
}

async function openClip(key, limitSec, isAudioOnly) {
  resetClip()
  Object.assign(clip, { key, limit: limitSec, isAudioOnly })
  try {
    clip.stream = await navigator.mediaDevices.getUserMedia({ video: !isAudioOnly, audio: true })
  } catch {
    clip.error = 'Camera or microphone unavailable here. Upload a file or write your feedback instead.'
  }
  render()
}

function attachClipLive() {
  const live = document.getElementById('clip-live')
  if (live && clip.stream) live.srcObject = clip.stream
}

function startClip() {
  const candidates = clip.isAudioOnly ? ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'] : ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
  const mimeType = candidates.find((type) => window.MediaRecorder?.isTypeSupported?.(type)) ?? ''
  const recorder = new MediaRecorder(clip.stream, mimeType ? { mimeType } : undefined)
  clip.recorder = recorder
  clip.chunks = []
  recorder.ondataavailable = (event) => { if (event.data.size) clip.chunks.push(event.data) }
  recorder.onstop = () => {
    clip.blob = new Blob(clip.chunks, { type: recorder.mimeType })
    clip.url = URL.createObjectURL(clip.blob)
    clip.stream?.getTracks().forEach((track) => track.stop())
    clip.stream = null
    render()
  }
  recorder.start()
  clip.isRecording = true
  clip.startedAt = Date.now()
  render()
  clip.timerId = setInterval(() => {
    const elapsed = (Date.now() - clip.startedAt) / 1000
    const timer = document.getElementById('clip-timer')
    if (timer) timer.textContent = formatSeconds(elapsed)
    if (elapsed >= clip.limit) stopClip()
  }, TIMER_TICK_MS)
}

function stopClip() {
  clearInterval(clip.timerId)
  clip.durationSec = Math.round((Date.now() - clip.startedAt) / 1000)
  clip.isRecording = false
  if (clip.recorder?.state === 'recording') clip.recorder.stop()
}

function resetClip() {
  clearInterval(clip.timerId)
  if (clip.recorder?.state === 'recording') {
    clip.recorder.onstop = null
    clip.recorder.stop()
  }
  clip.stream?.getTracks().forEach((track) => track.stop())
  if (clip.url) URL.revokeObjectURL(clip.url)
  Object.assign(clip, { key: null, limit: 0, isAudioOnly: false, stream: null, recorder: null, chunks: [], startedAt: 0, timerId: null, blob: null, url: null, durationSec: 0, isRecording: false, error: null })
}

    player.time = 0

  draw()
  getAvatarImage(NEUTRAL_AVATAR_COLOR).addEventListener('load', draw, { once: true })

function renderSlideStrip(slides) {
  if (!slides?.length) return '<p class="card-sub">No slides.</p>'
  return `<div class="slide-strip">${slides.map((slide, index) => `<div class="slide-card" style="cursor:default"><span class="slide-num">${index + 1}</span><span class="slide-title">${escapeHtml(slide.title)}</span><span class="slide-text">${escapeHtml(slide.text)}</span></div>`).join('')}</div>`
}

function allInvitations() {
  return appState.manuscripts.flatMap((manuscript) => manuscript.reviewers.map((reviewer, index) => ({ manuscript, reviewer, number: index + 1, key: `${manuscript.id}|${reviewer.id}` })))
}

function reviewerPeople() {
  const people = new Map()
  allInvitations().forEach(({ reviewer }) => people.set(reviewer.id, reviewer.name))
  return [...people].map(([id, name]) => ({ id, name }))
}

function activeReviewerId() {
  const all = allInvitations()
  const known = all.some((invitation) => invitation.reviewer.id === reviewerUi.reviewerId)
  if (!known) reviewerUi.reviewerId = (all.find((invitation) => ['invited', 'accepted'].includes(invitation.reviewer.status)) ?? all[0])?.reviewer.id ?? null
  return reviewerUi.reviewerId
}

function reviewerInvitations() {
  const reviewerId = activeReviewerId()
  return allInvitations().filter((invitation) => invitation.reviewer.id === reviewerId)
}

function resetReviewForm() {
  Object.assign(reviewerUi, { scores: {}, recommendation: '', commentsToAuthor: '', commentsToEditor: '', feedbackMode: 'recorded' })
  resetClip()
}

function currentInvitation() {
  const invitations = reviewerInvitations()
  const found = invitations.find((invitation) => invitation.key === reviewerUi.invitationKey)
    ?? invitations.find((invitation) => ['invited', 'accepted'].includes(invitation.reviewer.status))
    ?? invitations[0]
    ?? null
  if (found && found.key !== reviewerUi.invitationKey) {
    reviewerUi.invitationKey = found.key
    resetReviewForm()
  }
  return found
}

function invitationStatus(invitation) {
  const { reviewer } = invitation
  if (reviewer.status === 'invited') return daysUntil(reviewer.linkExpiresAt) < 0 ? { label: 'Link expired', tone: 'danger', action: 'View' } : { label: 'New invitation', tone: 'brand', action: 'Open' }
  if (reviewer.status === 'accepted') return { label: 'Review in progress', tone: 'warning', action: 'Continue' }
  if (reviewer.status === 'declined') return { label: 'Declined', tone: 'neutral', action: 'View' }
  return { label: 'Review submitted', tone: 'success', action: 'View' }
}

async function updateReviewer(manuscriptId, reviewerId, changes, event) {
  const manuscript = findManuscript(manuscriptId)
  const reviewers = manuscript.reviewers.map((reviewer) => (reviewer.id === reviewerId ? { ...reviewer, ...changes } : reviewer))
  await saveManuscript({ ...manuscript, reviewers, history: [...manuscript.history, { at: new Date().toISOString(), event }] })
}

  const invitation = currentInvitation()
  const invitations = reviewerInvitations()
  const header = renderPageHeader({
    eyebrow: 'Reviewer · Opened from the invitation email',

    lead: 'Watch the short pitch, decide whether to review, then score the manuscript and leave feedback. No password needed.',

  })
  if (!invitation) {

  }
  const { manuscript, reviewer } = invitation
  const model = REVIEW_MODELS.find((item) => item.id === manuscript.reviewModel)
  const linkDays = daysUntil(reviewer.linkExpiresAt)
  const isExpired = reviewer.status === 'invited' && linkDays < 0
  const strip = `
    <section class="card manuscript-strip">
      <div class="stack-sm">
        <p class="manuscript-title">${escapeHtml(manuscript.title)}</p>
        <div class="meta-list"><span><strong>${manuscript.id}</strong></span><span>${escapeHtml(manuscript.articleType)}</span><span>${escapeHtml(manuscript.journal)}</span><span>Invited ${formatDate(reviewer.invitedAt)}</span></div>
      </div>
      <div class="row">
        <span class="badge badge-brand">${icon(model.icon)}${model.label}</span>
        <span class="badge ${isExpired ? 'badge-danger' : 'badge-neutral'}">${icon('link')}${isExpired ? 'Link expired' : `Link valid ${Math.max(0, linkDays)} more days`}</span>
      </div>
    </section>`
  let body = ''
  if (isExpired) body = `<div class="banner banner-warning">${icon('link-2-off')}<div class="banner-body"><p class="banner-title">This invitation link has expired</p><p>Reply to the invitation email to ask the editor for a new link.</p></div></div>`

  return `${header}${renderReviewerHistory(invitation.key)}${strip}${body}`

async function submitReview() {
  const invitation = currentInvitation()
  const { manuscript, reviewer, number } = invitation
  const now = new Date().toISOString()
  const hasMedia = clip.key === 'review' && Boolean(clip.blob)
  const review = {
    scores: Object.fromEntries(appState.settings.criteria.map((criterion) => [criterion.name, Number(reviewerUi.scores[criterion.name])])),
    recommendation: reviewerUi.recommendation,
    commentsToAuthor: reviewerUi.commentsToAuthor.trim(),
    commentsToEditor: reviewerUi.commentsToEditor.trim(),
    feedbackMode: reviewerUi.feedbackMode,
    hasMedia,
    mediaType: hasMedia && clip.blob.type.startsWith('audio') ? 'audio' : 'video',
    durationSec: hasMedia ? clip.durationSec : 0,
    submittedAt: now,
  }
  try {
    await updateReviewer(manuscript.id, reviewer.id, { status: 'submitted', review }, `Reviewer ${number} submitted a review (${RECOMMENDATIONS.find((option) => option.id === review.recommendation).label})`)
  } catch {
    showToast('Could not submit. Check your access and try again.', 'alert-circle')
    return
  }
  if (hasMedia) await mediaDb.put(`review:${manuscript.id}:${reviewer.id}`, { blob: clip.blob, savedAt: now })
  resetClip()
  render()
  showToast('Review submitted. Thank you.')
}

function renderAuthorFeedback() {

  if (!manuscript?.pitch) {

  }
  const submittedReviews = manuscript.reviewers.filter((reviewer) => reviewer.status === 'submitted')
  const pendingReviews = manuscript.reviewers.filter((reviewer) => ['invited', 'accepted'].includes(reviewer.status))
  const steps = ['Pitch submitted', 'First decision', 'Peer review', 'Final decision']
  const stepState = (index) => {
    if (manuscript.decision === 'rejected') return index <= 1 ? 'is-done' : ''
    if (manuscript.decision === 'repitch') return index === 0 ? 'is-done' : index === 1 ? 'is-warning' : ''
    if (manuscript.decision === 'accepted') {
      const reviewsDone = submittedReviews.length > 0 && pendingReviews.length === 0
      if (index <= 1) return 'is-done'
      if (index === 2) return reviewsDone ? 'is-done' : 'is-current'
      return reviewsDone ? 'is-current' : ''
    }
    return index === 0 ? 'is-done' : index === 1 ? 'is-current' : ''
  }
  return `
    ${header}

function readability(text) {
  const sentences = splitSentences(text)
  const words = String(text).toLowerCase().match(/[a-z][a-z'-]*/g) ?? []
  const longWords = words.filter((word) => word.length >= 11)
  const wordsPerSentence = sentences.length ? Math.round(words.length / sentences.length) : 0
  const longPercent = words.length ? Math.round((longWords.length / words.length) * 100) : 0
  const jargon = [...new Set(words.filter((word) => JARGON_TERMS.includes(word)))]
  const isPlain = wordsPerSentence <= 18 && longPercent <= 8 && jargon.length === 0
  return { words: words.length, wordsPerSentence, longPercent, jargon, isPlain }
}

async function saveMedia(type) {
  const manuscript = findManuscript(mediaUi.manuscriptId)
  const now = new Date().toISOString()
  const media = { ...(manuscript.media ?? {}) }
  if (type === 'videoAbstract') {
    media.videoAbstract = { durationSec: clip.durationSec, savedAt: now }
    await mediaDb.put(`media:abstract:${manuscript.id}`, { blob: clip.blob, savedAt: now })
  } else {
    const check = readability(mediaUi.layText)
    const hasRecording = clip.key === 'lay-summary' && Boolean(clip.blob)
    media.laySummary = { text: mediaUi.layText.trim(), isPlain: check.isPlain, hasRecording, savedAt: now }
    if (hasRecording) await mediaDb.put(`media:lay:${manuscript.id}`, { blob: clip.blob, savedAt: now })
  }
  await saveManuscript({ ...manuscript, media, history: [...manuscript.history, { at: now, event: type === 'videoAbstract' ? 'Video abstract saved' : 'Lay summary saved' }] })
  resetClip()
  render()
  showToast(type === 'videoAbstract' ? 'Video abstract saved' : 'Lay summary saved')
}

function refreshPaged(key) {
  if (key === 'queue') {
    document.getElementById('queue-body').innerHTML = renderQueueBody(filteredQueue())
    refreshIcons()
    return
  }
  if (key === 'switcher') {
    document.getElementById('switch-body').innerHTML = renderSwitchBody()
    refreshIcons()
    return
  }
  render()
}

function render() {
  const view = currentView()
  renderSideNav(view)
  const renderer = VIEW_RENDERERS[view.id]
  const main = document.getElementById('main')
  const scrollTop = main.scrollTop
  document.getElementById('view').innerHTML = renderer ? renderer(view) : renderPlaceholderView(view)
  main.scrollTop = scrollTop
  refreshIcons()
  VIEW_AFTER_RENDER[view.id]?.()
  attachClipLive()
}

function openModal(html) {
  document.getElementById('modal-root').innerHTML = `<div class="modal-backdrop" data-action="backdrop">${html}</div>`

function closeModal() {

  document.getElementById('modal-root').innerHTML = ''

function setByPath(target, path, value) {
  const keys = path.split('.')
  const last = keys.pop()
  keys.reduce((node, key) => node[key], target)[last] = value
}

function rerenderKeepingFocus() {
  const activeId = document.activeElement?.id
  render()
  if (activeId) document.getElementById(activeId)?.focus()
}

async function copyText(value) {
  try {
    await navigator.clipboard.writeText(value)
    showToast('Copied')
  } catch {
    showToast('Copy failed. Select the text and copy it manually.', 'alert-circle')
  }
}

function generateSecret() {
  const bytes = crypto.getRandomValues(new Uint8Array(16))
  return `whsec_${[...bytes].map((byte) => byte.toString(16).padStart(2, '0')).join('')}`
}

  'download-manuscript': () => showToast('Prototype: the manuscript PDF downloads here.', 'download'),
  'submit-review': () => submitReview(),
  'reviewer-account': (target) => showToast(target.dataset.value === 'orcid' ? 'Prototype: ORCID linked. Review credit will be added.' : 'Prototype: password set.', 'check-circle-2'),
  'save-media': (target) => saveMedia(target.dataset.type),
  'reuse-pitch': () => showToast('Prototype: your pitch slides and script are loaded as a starting point.', 'copy'),
  'submit-media': async () => {
    const manuscript = findManuscript(mediaUi.manuscriptId)
    const now = new Date().toISOString()
    await saveManuscript({ ...manuscript, media: { ...(manuscript.media ?? {}), submittedAt: now }, history: [...manuscript.history, { at: now, event: 'Video abstract and lay summary sent to the journal' }] })
    render()
    showToast('Sent to the journal for publishing')
  },
  'send-congrats': () => sendCongrats(),
  'post-comment': async () => {
    const text = readerUi.commentText.trim()
    if (!text) {
      showToast('Write a comment first.', 'alert-circle')
      return
    }
    const manuscript = findManuscript(readerUi.manuscriptId)
    const comment = { id: `c-${Date.now()}`, name: 'You (reader)', text, at: new Date().toISOString() }
    await saveManuscript({ ...manuscript, comments: [...(manuscript.comments ?? []), comment] })
    readerUi.commentText = ''
    render()
    showToast('Comment posted')
  },
})

Object.assign(INPUT_ACTIONS, {
  'edit-review-text': (target) => { reviewerUi[target.dataset.field] = target.value },
  'edit-lay-text': (target) => {
    mediaUi.layText = target.value
    document.getElementById('readability').innerHTML = renderReadability(readability(target.value))
  },
  'edit-congrats-text': (target) => { congratsUi.text = target.value },
  'edit-comment': (target) => { readerUi.commentText = target.value },
})

Object.assign(CHANGE_ACTIONS, {
  'set-recommendation': (target) => { reviewerUi.recommendation = target.value; render() },
  'select-reviewer': (target) => { reviewerUi.reviewerId = target.value; reviewerUi.invitationKey = null; pageState.reviewerHistory = 1; currentInvitation(); player.isPlaying = false; render() },
  'edit-review-text': () => rerenderKeepingFocus(),
  'edit-congrats-text': () => rerenderKeepingFocus(),
  'select-media-article': (target) => { mediaUi.manuscriptId = target.value; mediaUi.layText = defaultLaySummary(findManuscript(target.value)); resetClip(); render() },
  'select-congrats-article': (target) => { congratsUi.manuscriptId = target.value; resetClip(); render() },
  'select-reader-article': (target) => { readerUi.manuscriptId = target.value; player.isPlaying = false; render() },
  'set-congrats-template': (target) => {
    congratsUi.templateId = target.value
    congratsUi.text = CONGRATS_TEMPLATES.find((template) => template.id === target.value).text
    render()
  },
})

document.getElementById('clip-file-input').addEventListener('change', (event) => {
  const file = event.target.files[0]
  event.target.value = ''
  if (!file) return
  if (file.size > appState.settings.limits.maxFileMb * 1024 * 1024) {
    showToast(`That file is over ${appState.settings.limits.maxFileMb} MB.`, 'alert-circle')
    return
  }
  resetClip()
  Object.assign(clip, { key: 'review', blob: file, url: URL.createObjectURL(file) })
  const probe = document.createElement(file.type.startsWith('audio') ? 'audio' : 'video')
  probe.preload = 'metadata'
  probe.onloadedmetadata = () => {
    if (Number.isFinite(probe.duration)) clip.durationSec = Math.round(probe.duration)
    if (clip.durationSec > appState.settings.limits.reviewerFeedbackSeconds) {
      showToast(`That recording is ${formatSeconds(clip.durationSec)}. The limit is ${formatSeconds(appState.settings.limits.reviewerFeedbackSeconds)}.`, 'alert-circle')
      resetClip()
    }
    render()
  }
  probe.src = clip.url
  render()
})

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]')
  if (!target || target.disabled) return
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(target.tagName)) return
  CLICK_ACTIONS[target.dataset.action]?.(target, event)
})

document.addEventListener('input', (event) => {
  const target = event.target.closest('[data-action]')
  if (target) INPUT_ACTIONS[target.dataset.action]?.(target, event)
})

document.addEventListener('change', (event) => {
  if (event.target.classList.contains('consent-check')) {
    const allChecked = [...document.querySelectorAll('.consent-check')].every((checkbox) => checkbox.checked)
    document.getElementById('consent-submit').disabled = !allChecked
    return
  }
  const target = event.target.closest('[data-action]')
  if (target) CHANGE_ACTIONS[target.dataset.action]?.(target, event)
})

document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return
  if (document.getElementById('modal-root').innerHTML) closeModal()
  else if (document.getElementById('drawer-root').innerHTML) closeDrawer()
  else if (studio.countdown > 0) cancelCountdown()
})

document.getElementById('slides-input').addEventListener('change', (event) => {
  const file = event.target.files[0]
  event.target.value = ''
  if (!file) return
  const baseName = file.name.replace(/\.[^.]+$/, '')
  studio.slides = Array.from({ length: 6 }, (_, index) => ({ title: index === 0 ? baseName : `Slide ${index + 1}`, text: `From ${file.name}` }))
  studio.slidesSource = 'upload'
  studio.slideIndex = 0
  render()
  showToast(`${file.name} added`)
})

document.getElementById('video-input').addEventListener('change', (event) => {
  const file = event.target.files[0]
  event.target.value = ''
  handleVideoFile(file)
})

window.addEventListener('hashchange', () => {
  if (studio.isRecording) stopRecording()
  if (studio.countdown > 0) cancelCountdown()
  if (currentView().id !== 'pitch-settings') appState.settingsDraft = null
  if (currentView().id !== 'author-studio') stopMedia()
  player.isPlaying = false
  resetClip()
  closeModal()
  closeDrawer()
  render()
  document.getElementById('main').scrollTop = 0
})

loadLocalMode()
render()
connectSharedStorage()
checkForDraft()
</script>
</body>
</html>
