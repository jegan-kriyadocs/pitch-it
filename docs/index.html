<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pitch It Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kriyadocs app shell — fixed header, left sidebar grouped by role, scrolling work area. Single light theme matching the client repo. */
:root {
  --brand-50: #f5f0fa; --brand-100: #ebe4f5; --brand-200: #d4c4ec; --brand-300: #b49dd9; --brand-500: #7854b8; --brand-600: #5f259f; --brand-700: #511e8a; --brand-900: #2a0e4a;
  --page: #f9fafb; --surface: #ffffff; --surface-muted: #f3f4f6; --border: #e5e7eb; --border-strong: #d1d5db;
  --heading: #111827; --heading-secondary: #374151; --body: #4b5563; --muted: #6b7280; --faint: #9ca3af;
  --accent: var(--brand-600); --accent-hover: var(--brand-700); --accent-soft: var(--brand-50); --accent-text: var(--brand-700); --on-accent: #ffffff;
  --success-bg: #d1fae5; --success-fg: #047857; --success: #10b981;
  --warning-bg: #fef3c7; --warning-fg: #92400e; --warning: #f59e0b;
  --danger-bg: #fee2e2; --danger-fg: #b91c1c; --danger: #dc2626;
  --info-bg: #e0f2fe; --info-fg: #0369a1;
  --stage-bg: #1b1426; --stage-panel: #261c35; --stage-fg: #ebe4f5; --stage-muted: #b49dd9; --overlay: rgb(17 24 39 / 0.66); --on-overlay: #ffffff;
  --shadow-raised: 0 1px 2px rgb(17 24 39 / 0.04), 0 12px 32px rgb(17 24 39 / 0.06);
  --shadow-dialog: 0 24px 48px rgb(17 24 39 / 0.25);
  --font-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius-sm: 0.375rem; --radius: 0.5rem; --radius-lg: 0.75rem;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--body); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { color: var(--heading); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon { width: 18px; height: 18px; flex-shrink: 0; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-size: 13px; }

.app { display: flex; flex-direction: column; height: 100%; }
.app-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; flex-shrink: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo { height: 34px; width: auto; }
.brand-divider { width: 1px; height: 24px; background: var(--border); }
.brand-product { font-weight: 600; color: var(--heading); white-space: nowrap; }
.header-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.app-body { display: flex; flex: 1; min-height: 0; }
.side-nav { width: 248px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 12px 12px; overflow-y: auto; }
.nav-label { padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.role-switcher { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; background: var(--surface-muted); border-radius: var(--radius); }
.role-option { display: flex; align-items: center; justify-content: center; gap: 6px; height: 32px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--body); font-size: 13px; font-weight: 500; cursor: pointer; }
.role-option[aria-pressed="true"] { background: var(--surface); color: var(--accent-text); font-weight: 600; box-shadow: 0 1px 2px rgb(17 24 39 / 0.08); }
.role-option .icon { width: 15px; height: 15px; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-link { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--radius); color: var(--body); font-weight: 500; text-decoration: none; white-space: nowrap; }
.nav-link:hover { background: var(--surface-muted); color: var(--heading); }
.nav-link .icon { color: var(--faint); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.nav-link[aria-current="page"] .icon { color: var(--accent); }
.nav-link > span:not(.badge) { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.queue-tools .segmented { display: grid; grid-template-columns: repeat(5, auto); }
.queue-tools .segmented button { justify-content: center; padding: 0 6px; }
.nav-footer { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

.main { flex: 1; min-width: 0; overflow-y: auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

.page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-header-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 72ch; }
.eyebrow { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); min-width: 0; }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-title { font-size: 15px; font-weight: 600; }
.card-sub { font-size: 13px; color: var(--muted); }
.card-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; line-height: normal; white-space: nowrap; }
.badge-xs { padding: 1px 6px; font-size: 11px; }
.badge .icon { width: 13px; height: 13px; }
.badge-neutral { background: var(--surface-muted); color: var(--heading-secondary); }
.badge-brand { background: var(--accent-soft); color: var(--accent-text); }
.badge-success { background: var(--success-bg); color: var(--success-fg); }
.badge-warning { background: var(--warning-bg); color: var(--warning-fg); }
.badge-danger { background: var(--danger-bg); color: var(--danger-fg); }
.badge-info { background: var(--info-bg); color: var(--info-fg); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot.is-green { background: var(--success); }
.status-dot.is-amber { background: var(--warning); }
.status-dot.is-gray { background: var(--faint); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--radius); border: 1px solid transparent; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none; }
.btn .icon { width: 15px; height: 15px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn-secondary { background: var(--surface); border-color: var(--border); color: var(--heading-secondary); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-muted); }
.btn-ghost { background: transparent; color: var(--heading-secondary); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-muted); }
.btn-danger { background: var(--danger); color: var(--on-accent); }
.btn-danger:hover:not(:disabled) { background: var(--danger-fg); }
.btn-record { background: var(--danger); color: var(--on-accent); }
.btn-record:hover:not(:disabled) { background: var(--danger-fg); }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; }
.btn-lg { height: 44px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 13px; font-weight: 600; color: var(--heading-secondary); }
.field-hint { font-size: 12px; color: var(--muted); }
.input, .select { height: 36px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--heading); width: 100%; min-width: 0; }
.input[readonly] { background: var(--surface-muted); color: var(--heading-secondary); }
.textarea { min-height: 140px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--heading); resize: vertical; width: 100%; line-height: 1.55; }
.input-with-unit { display: flex; align-items: center; gap: 8px; }
.input-with-unit .input { width: 96px; font-variant-numeric: tabular-nums; }
.input-group { display: flex; gap: 8px; }
.input-group .input { flex: 1; }
.unit { font-size: 13px; color: var(--muted); }
.checkbox { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--body); cursor: pointer; }
.checkbox input { margin-top: 2px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

.radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.radio-card { display: flex; flex-direction: column; gap: 6px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; text-align: left; }
.radio-card:hover { border-color: var(--border-strong); }
.radio-card[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.radio-card-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--heading); }
.radio-card-text { font-size: 13px; color: var(--body); }

.segmented { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--surface-muted); border-radius: var(--radius); }
.segmented button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: transparent; font-size: 13px; font-weight: 500; color: var(--body); cursor: pointer; white-space: nowrap; }
.segmented button .icon { width: 14px; height: 14px; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--accent-text); font-weight: 600; box-shadow: 0 1px 2px rgb(17 24 39 / 0.08); }
.segmented button:disabled { opacity: 0.5; cursor: not-allowed; }

.tabs { display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs-flush { padding: 0; }
.tab { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab .icon { width: 16px; height: 16px; }
.tab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
.tab:disabled { opacity: 0.5; cursor: not-allowed; }

.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 20px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.table td { padding: 10px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table-note { font-size: 12px; color: var(--muted); }

.criteria-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.criteria-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 2fr) 32px; gap: 8px; align-items: center; }
.criteria-index { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: var(--radius); background: transparent; color: var(--muted); cursor: pointer; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface-muted); color: var(--heading); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius); background: var(--surface-muted); font-size: 13px; color: var(--body); }
.note .icon { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }
.note-warning { background: var(--warning-bg); color: var(--warning-fg); }
.note-warning .icon { color: var(--warning-fg); }
.note-info { background: var(--info-bg); color: var(--info-fg); }
.note-info .icon { color: var(--info-fg); }
.note-success { background: var(--success-bg); color: var(--success-fg); }
.note-success .icon { color: var(--success-fg); }
.note-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--surface); }
.banner > .icon { margin-top: 2px; }
.banner-body { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.banner-title { font-weight: 600; color: var(--heading); }
.banner-warning { background: var(--warning-bg); border-color: transparent; }
.banner-warning > .icon, .banner-warning .banner-title { color: var(--warning-fg); }
.banner-info { background: var(--info-bg); border-color: transparent; }
.banner-info > .icon, .banner-info .banner-title { color: var(--info-fg); }
.banner-success { background: var(--success-bg); border-color: transparent; }
.banner-success > .icon, .banner-success .banner-title { color: var(--success-fg); }

.sticky-bar { position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-raised); }

.settings-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.settings-nav { position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px; }
.settings-nav button { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border: 0; border-radius: var(--radius); background: transparent; color: var(--body); font-weight: 500; text-align: left; cursor: pointer; }
.settings-nav button:hover { background: var(--surface-muted); }
.settings-nav button[aria-current="true"] { background: var(--surface); color: var(--accent-text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border); }
.settings-nav .icon { width: 16px; height: 16px; color: var(--faint); }
.settings-nav button[aria-current="true"] .icon { color: var(--accent); }
.connection { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); }
.connection-mark { width: 40px; height: 40px; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.connection-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.connection-text strong { color: var(--heading); }
.connection-text span { font-size: 12px; color: var(--muted); }
.setting-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting-row:first-child { padding-top: 0; }
.setting-row:last-child { border-bottom: 0; padding-bottom: 0; }
.setting-row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.setting-row-text strong { color: var(--heading); font-weight: 600; }
.setting-row-text span { font-size: 13px; color: var(--muted); }
.event-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.manuscript-strip { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 16px 20px; }
.manuscript-title { font-size: 15px; font-weight: 600; color: var(--heading); max-width: 80ch; }
.meta-list { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--muted); }
.meta-list strong { color: var(--heading-secondary); font-weight: 600; }

.studio-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: var(--stage-bg); border-radius: var(--radius); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.stage video, .stage canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.stage .is-contained { object-fit: contain; }
.stage-empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; max-width: 460px; text-align: center; color: var(--stage-fg); }
.stage-empty .icon { width: 32px; height: 32px; color: var(--stage-muted); }
.stage-empty p { font-size: 13px; color: var(--stage-muted); }
.stage-overlay-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--overlay); color: var(--on-overlay); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill .icon { width: 13px; height: 13px; }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.stage-warning { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: var(--radius); background: var(--warning-bg); color: var(--warning-fg); font-size: 12px; font-weight: 600; }
.stage-warning .icon { width: 14px; height: 14px; }
.teleprompter { position: absolute; left: 50%; top: 46px; transform: translateX(-50%); width: min(72%, 620px); max-height: 30%; overflow: hidden; padding: 10px 16px; border-radius: var(--radius); background: var(--overlay); color: var(--on-overlay); font-size: 15px; line-height: 1.5; text-align: center; }
.teleprompter-text { transition: transform 600ms linear; white-space: pre-line; }
.countdown { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgb(27 20 38 / 0.72); color: var(--on-overlay); }
.countdown-number { font-size: 120px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; animation: count-pop 900ms ease-out; }
@keyframes count-pop { from { transform: scale(1.6); opacity: 0; } 40% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
.stage-slide { position: static; width: 78%; aspect-ratio: 16 / 10; max-width: 100%; padding: 28px; border-radius: var(--radius-sm); background: var(--surface); color: var(--heading); display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.stage-slide .slide-title { font-size: 22px; }
.stage-slide .slide-text { font-size: 15px; }
.caption-line { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 86%; padding: 6px 12px; border-radius: var(--radius-sm); background: var(--overlay); color: var(--on-overlay); font-size: 14px; text-align: center; }
.caption-line:empty { display: none; }

.device-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(140px, 0.8fr); gap: 12px; align-items: end; }
.device-bar.is-audio { grid-template-columns: minmax(0, 1fr) minmax(140px, 0.8fr); }
.meter { display: flex; flex-direction: column; gap: 6px; }
.meter-track { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; height: 36px; align-items: center; }
.meter-track span { height: 14px; border-radius: 2px; background: var(--border); transition: background 80ms; }
.meter-track span.is-on { background: var(--success); }
.meter-track span.is-hot { background: var(--warning); }
.meter-track span.is-clip { background: var(--danger); }

.progress { height: 4px; background: var(--surface-muted); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width 250ms linear; }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--heading); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--heading-secondary); cursor: pointer; }
.switch input { appearance: none; width: 32px; height: 18px; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; transition: background 150ms; flex-shrink: 0; margin: 0; }

details summary { cursor: pointer; font-weight: 600; color: var(--accent-text); font-size: 13px; }

.modal-wide { width: min(820px, 100%); }
.modal-header { display: flex; flex-direction: column; gap: 6px; padding: 20px 24px 0; }
.modal-title { font-size: 18px; font-weight: 700; }

.modal-footer { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 16px 24px; border-top: 1px solid var(--border); }
.summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.summary-item strong { color: var(--heading); font-variant-numeric: tabular-nums; }

.score-bar-track i.is-on { background: var(--accent); }

.media-tile img { width: 52px; height: 52px; flex-shrink: 0; }

.clip video, .clip-audio { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius); background: var(--stage-bg); object-fit: cover; }
.clip-audio { display: flex; align-items: center; justify-content: center; color: var(--stage-muted); }

.lay-summary { padding: 18px 20px; border-radius: var(--radius-lg); background: var(--accent-soft); }

.comment-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.comment { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; }
.comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.comment-meta { font-size: 12px; color: var(--muted); }
.comment p { color: var(--heading-secondary); }

.placeholder { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 64px 24px; text-align: center; color: var(--muted); }

.toast-viewport { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; }

    this.arcTo(x + width, y, x + width, y + height, corner)
    this.arcTo(x + width, y + height, x, y + height, corner)

    this.arcTo(x, y, x + width, y, corner)
    this.closePath()
  }
}

function relativeTime(iso) {
  const minutes = Math.round((Date.now() - new Date(iso)) / 60000)
  if (minutes < 1) return 'just now'
  if (minutes < 60) return `${minutes} min ago`
  const hours = Math.round(minutes / 60)
  if (hours < 24) return `${hours} h ago`
  const days = Math.round(hours / 24)
  return `${days} day${days === 1 ? '' : 's'} ago`
}

function deepMerge(base, override) {
  if (!override || typeof override !== 'object' || Array.isArray(override)) return override ?? base
  const result = { ...base }
  Object.entries(override).forEach(([key, value]) => {
    result[key] = base?.[key] && typeof base[key] === 'object' && !Array.isArray(base[key]) ? deepMerge(base[key], value) : value
  })
  return result
}

function readJson(key) {
  try {
    const raw = localStorage.getItem(key)
    return raw ? JSON.parse(raw) : null
  } catch {
    return null
  }
}

function writeJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value))
  } catch {
    return
  }
}

function openMediaDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(IDB_NAME, 1)
    request.onupgradeneeded = () => request.result.createObjectStore(IDB_STORE)
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
}

async function mediaDbRequest(mode, operation) {
  try {
    const database = await openMediaDb()
    return await new Promise((resolve, reject) => {
      const request = operation(database.transaction(IDB_STORE, mode).objectStore(IDB_STORE))
      request.onsuccess = () => resolve(request.result)
      request.onerror = () => reject(request.error)
    })
  } catch {
    return null
  }
}

const mediaDb = {
  get: (key) => mediaDbRequest('readonly', (store) => store.get(key)),
  put: (key, value) => mediaDbRequest('readwrite', (store) => store.put(value, key)),
  remove: (key) => mediaDbRequest('readwrite', (store) => store.delete(key)),
  clear: () => mediaDbRequest('readwrite', (store) => store.clear()),
}

    ['JCM-2026-0150', 'awaiting', 1, null], ['JCM-2026-0149', 'awaiting', 2, null], ['JCM-2026-0138', 'awaiting', 3, null],
    ['JCM-2026-0148', 'repitch', 5, null], ['JCM-2026-0147', 'in-review', 8, 'submitted'], ['JCM-2026-0146', 'in-review', 7, 'accepted'],
    ['JCM-2026-0127', 'in-review', 10, 'submitted', 'Vitamin D supplementation and fracture risk in care-home residents', 'Clinical Trial'],
    ['JCM-2026-0126', 'in-review', 9, 'submitted', 'Regional versus general anaesthesia for hip fracture surgery', 'Original Research'],
    ['JCM-2026-0125', 'in-review', 9, 'declined', 'Smartwatch detection of atrial fibrillation after surgery', 'Original Research'],

    ['JCM-2026-0122', 'in-review', 11, 'submitted', 'Antibiotic prophylaxis duration in elective hernia repair', 'Clinical Trial'],

    ['JCM-2026-0118', 'awaiting', 2, null, 'Pharmacogenomic testing for warfarin dosing in primary care', 'Original Research'],
  ]
  return specs.map(([id, status, age, reviewerStatus, title, articleType], index) => {

    return {

  })
}

async function saveSettings(settings) {

    return

  writeLocalState()

async function saveManuscript(manuscript) {
  const index = appState.manuscripts.findIndex((item) => item.id === manuscript.id)
  if (index === -1) appState.manuscripts.push(manuscript)
  else appState.manuscripts[index] = manuscript
  if (appState.storageMode === 'shared' && sharedDb) {
    await sharedDb.collection('manuscripts').doc(manuscript.id).set(manuscript)
    return
  }
  writeLocalState()
}

function loadLocalMode() {
  const stored = readJson(LOCAL_STORAGE_KEY)
  if (stored) {
    appState.settings = deepMerge(structuredClone(DEFAULT_SETTINGS), stored.settings)
    appState.manuscripts = stored.manuscripts ?? []
    return
  }
  appState.manuscripts = buildExampleManuscripts()
  writeLocalState()
}

async function seedSharedData(db) {
  try {
    const marker = await db.doc('config/seeded').get()
    if (marker.exists) return
    await db.doc('config/settings').set(structuredClone(DEFAULT_SETTINGS))
    await Promise.all(buildExampleManuscripts().map((manuscript) => db.collection('manuscripts').doc(manuscript.id).set(manuscript)))
    await db.doc('config/seeded').set({ at: new Date().toISOString() })
  } catch {
    updateStorageStatus('Shared storage is read-only for you')
  }
}

async function connectSharedStorage() {
  if (!window.claude?.use) return
  const db = await window.claude.use('db')
  if (!db) return
  sharedDb = db
  appState.storageMode = 'shared'
  appState.manuscripts = []
  updateStorageStatus('Connecting…')
  render()
  await seedSharedData(db)
  const timeout = setTimeout(() => updateStorageStatus('Shared storage is slow to respond'), DB_CONNECT_TIMEOUT_MS)
  db.doc('config/settings').onSnapshot((snapshot) => {
    clearTimeout(timeout)
    appState.settings = snapshot.exists ? deepMerge(structuredClone(DEFAULT_SETTINGS), snapshot.data()) : structuredClone(DEFAULT_SETTINGS)
    updateStorageStatus('Shared with everyone on this link')
    if (!appState.settingsDraft && !isBusy()) render()
  }, () => {
    clearTimeout(timeout)
    updateStorageStatus('Shared storage unavailable')
  })
  db.collection('manuscripts').onSnapshot((snapshot) => {
    appState.manuscripts = snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() }))
    if (!isBusy()) render()
  })
}

const pageState = { queue: 1, switcher: 1, reviewerHistory: 1 }

function paginate(items, key) {
  const pageCount = Math.max(1, Math.ceil(items.length / PAGE_SIZE))
  const page = Math.min(Math.max(1, pageState[key]), pageCount)
  pageState[key] = page
  return { items: items.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE), page, pageCount, total: items.length }
}

function renderPager(key, info) {
  if (info.total <= PAGE_SIZE) return ''
  const numbers = Array.from({ length: info.pageCount }, (_, index) => index + 1)
  return `
    <nav class="pager" aria-label="Pagination">
      <span class="pager-summary">${(info.page - 1) * PAGE_SIZE + 1}–${Math.min(info.page * PAGE_SIZE, info.total)} of ${info.total}</span>
      <div class="pager-buttons">
        <button type="button" class="btn btn-ghost btn-sm" data-action="set-page" data-key="${key}" data-page="${info.page - 1}" ${info.page === 1 ? 'disabled' : ''}>Previous</button>
        ${numbers.map((number) => `<button type="button" class="btn btn-sm ${number === info.page ? 'btn-primary' : 'btn-ghost'}" data-action="set-page" data-key="${key}" data-page="${number}" aria-label="Page ${number}" ${number === info.page ? 'aria-current="page"' : ''}>${number}</button>`).join('')}
        <button type="button" class="btn btn-ghost btn-sm" data-action="set-page" data-key="${key}" data-page="${info.page + 1}" ${info.page === info.pageCount ? 'disabled' : ''}>Next</button>
      </div>
    </nav>`
}

function isPersonalEmail(email) {
  const domain = String(email).split('@')[1]?.toLowerCase() ?? ''
  return PERSONAL_EMAIL_DOMAINS.includes(domain)
}

function computeIdentity({ isLive, email, orcidKey }) {
  const orcid = ORCID_EXAMPLES[orcidKey]
  const hasInstitutionalEmail = !isPersonalEmail(email)
  const hasEstablishedOrcid = orcid.trustedWorks >= 2
  const isGreen = isLive && (hasInstitutionalEmail || hasEstablishedOrcid)
  return {
    badge: isGreen ? 'green' : 'amber',
    label: isGreen ? 'Identity verified · Live recording confirmed' : 'Identity verified · Academic ID only (no live recording)',
    reasons: [
      `ORCID ${orcid.id} · ${orcid.trustedWorks} trusted works · ${orcid.ageMonths} months old`,
      hasInstitutionalEmail ? 'Institutional email domain' : 'Personal email domain',
      isLive ? 'Live recording in the Author Studio' : 'No live recording (upload or slides + script)',
    ],
  }
}

}

function findIdentifyingTerms(text) {
  return [...new Set((String(text).match(IDENTIFYING_PATTERN) ?? []).map((term) => term.toLowerCase()))]

  return studio.slides

function editorStatus(manuscript) {
  if (manuscript.decision === 'accepted') return { id: 'in-review', label: 'Under review', tone: 'info' }
  if (manuscript.decision === 'rejected') return { id: 'decided', label: 'Desk rejected', tone: 'neutral' }
  if (manuscript.decision === 'repitch') {
    return daysUntil(manuscript.repitchDeadline) < 0
      ? { id: 'repitch', label: 'Re-pitch overdue', tone: 'danger' }
      : { id: 'repitch', label: 'Waiting for re-pitch', tone: 'warning' }
  }
  if (manuscript.pitch?.status === 'processing') return { id: 'awaiting', label: 'Processing', tone: 'neutral' }
  return { id: 'awaiting', label: manuscript.pitchVersion > 1 ? 'New pitch to review' : 'Awaiting decision', tone: 'brand' }
}

function activeSubmission() {

}

function draftKey() {

}

function submissionStatus(submission) {
  const manuscript = findManuscript(submission.id)
  if (!manuscript?.pitch) {
    return appState.settings.pitchRequirement[submission.articleType] === 'exempt' ? { label: 'No pitch needed', tone: 'neutral' } : { label: 'Draft', tone: 'neutral' }
  }
  if (manuscript.decision === 'repitch') return { label: 'Re-pitch', tone: 'warning' }
  if (manuscript.decision === 'accepted') return { label: 'In review', tone: 'info' }
  if (manuscript.decision === 'rejected') return { label: 'Not sent for review', tone: 'neutral' }
  return { label: 'Submitted', tone: 'brand' }
}

function filteredSubmissions() {

}

function avatarSvg(color) {
  return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><defs><linearGradient id='bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='${color}'/><stop offset='1' stop-color='${color}' stop-opacity='0.78'/></linearGradient><linearGradient id='fg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#ffffff' stop-opacity='0.95'/><stop offset='1' stop-color='#ffffff' stop-opacity='0.72'/></linearGradient><clipPath id='c'><circle cx='100' cy='100' r='100'/></clipPath></defs><circle cx='100' cy='100' r='100' fill='url(#bg)'/><g clip-path='url(#c)'><circle cx='100' cy='80' r='34' fill='url(#fg)'/><path d='M30 200c0-44 31-72 70-72s70 28 70 72z' fill='url(#fg)'/><path d='M84 130l16 18 16-18' fill='none' stroke='${color}' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/><g fill='none' stroke='${color}' stroke-width='3.5' stroke-opacity='0.7'><circle cx='87' cy='80' r='9'/><circle cx='113' cy='80' r='9'/><path d='M96 80h8'/></g></g></svg>`
}

function avatarDataUrl(color) {
  return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(avatarSvg(color))}`

function getAvatarImage(color) {
  if (!avatarImages.has(color)) {

}

function renderManuscriptStrip(manuscript, requirement) {
  const model = REVIEW_MODELS.find((item) => item.id === appState.settings.reviewModel)
  const requirementBadge = { mandatory: ['badge-warning', 'Pitch required'], optional: ['badge-neutral', 'Pitch optional'], exempt: ['badge-neutral', 'Pitch not needed'] }[requirement]
  return `
    <section class="card manuscript-strip">
      <div class="stack-sm">
        <p class="manuscript-title">${escapeHtml(activeSubmission().title)}</p>
        <div class="meta-list">
          <span><strong>${activeSubmission().id}</strong></span>
          <span>${activeSubmission().articleType}</span>
          <span>${LAUNCH_CONTEXT.journal}</span>
          <span>Opened from the Kriyadocs submission form</span>
        </div>
      </div>
      <div class="row">
        <span class="badge ${requirementBadge[0]}">${requirementBadge[1]}</span>
        <span class="badge badge-brand">${icon(model.icon)}${model.label}</span>
        ${manuscript ? `<span class="badge badge-info">${escapeHtml(authorStatusLabel(manuscript))}</span>` : ''}
        <button type="button" class="btn btn-secondary btn-sm" data-action="open-switcher">${icon('arrow-left-right')}Switch manuscript<span class="badge badge-neutral badge-xs">${AUTHOR_SUBMISSIONS.length}</span></button>
      </div>
    </section>`
}

function renderAuthorStudio() {
  const submission = activeSubmission()
  const manuscript = findManuscript(submission.id)
  const requirement = appState.settings.pitchRequirement[submission.articleType]
  const isRepitch = manuscript?.decision === 'repitch'
  const hasSubmitted = Boolean(manuscript?.pitch) && !isRepitch
  let body = renderStudioWorkspace(manuscript, isRepitch)
  if (requirement === 'exempt') body = `<section class="card"><div class="placeholder">${icon('circle-slash')}<h2 class="card-title">No pitch needed</h2><p>The journal does not use pitches for ${escapeHtml(submission.articleType)} articles.</p></div></section>`
  else if (!authorSession.signedIn) body = renderSignedOutState()
  else if (hasSubmitted) body = renderSubmittedState(manuscript)

  return `
    ${renderPageHeader({
      eyebrow: 'Author · Submission',
      title: 'Author Studio',
      lead: 'Tell editors in under three minutes why your research matters. Record live, upload a video, or use slides with a written script.',
      release: 'R1',
      actions: authorSession.signedIn ? `<button type="button" class="btn btn-ghost btn-sm" data-action="sign-out">${icon('log-out')}Sign out of ORCID</button>` : '',
    })}
    ${renderManuscriptStrip(manuscript, requirement)}
    ${body}`
}

function renderSignedOutState() {
  return `
    <section class="card">
      <div class="placeholder">
        ${icon('fingerprint')}
        <h2 class="card-title">Sign in with ORCID to start your pitch</h2>
        <p>We check your ORCID record and email so editors can trust who is presenting.</p>
        <button type="button" class="btn btn-primary" data-action="open-sign-in">${icon('log-in')}Sign in with ORCID</button>
      </div>
    </section>`
}

function renderSubmittedState(manuscript) {
  const pitch = manuscript.pitch
  const isProcessing = pitch.status === 'processing'
  const mode = PITCH_MODES.find((item) => item.id === pitch.mode)
  return `
    <div class="banner ${isProcessing ? 'banner-info' : 'banner-success'}">
      ${icon(isProcessing ? 'loader' : 'check-circle-2')}
      <div class="banner-body">
        <p class="banner-title">${isProcessing ? 'Pitch submitted · Cadmore is preparing your video' : 'Pitch submitted · Ready for the editor'}</p>
        <p>${isProcessing ? 'Captions, transcript and the anonymized version are being created. This usually takes a few minutes.' : 'The editor has been notified. You will get an email when a decision is made.'}</p>
      </div>
    </div>
    <div class="studio-grid">
      <section class="card">
        <div class="card-header"><div><h2 class="card-title">Your submitted pitch</h2><p class="card-sub">Submitted ${formatDateTime(pitch.submittedAt)}${manuscript.pitchVersion > 1 ? ` · version ${manuscript.pitchVersion}` : ''}</p></div></div>
        <div class="card-body">
          <div class="stage" id="submitted-stage">
            <div class="stage-empty">${icon('film')}<p>Your recording plays here on this device. Other viewers see the Cadmore player once processing finishes.</p></div>
          </div>
          <div class="summary-grid">
            <div class="summary-item"><span>Format</span><strong>${escapeHtml(pitch.source === 'upload' ? 'Uploaded video' : mode?.label ?? '')}</strong></div>
            <div class="summary-item"><span>Length</span><strong>${formatSeconds(pitch.durationSec)}</strong></div>
            <div class="summary-item"><span>Slides</span><strong>${pitch.slideCount || 'None'}</strong></div>
          </div>
        </div>
      </section>
      <div class="stack">
        <section class="card">
          <div class="card-header"><div><h2 class="card-title">What the editor sees</h2></div></div>
          <div class="card-body">
            ${renderIdentityBadge(manuscript.identity)}
            <p class="card-sub">${manuscript.reviewModel === 'double-blind' ? 'Reviewers will only receive the anonymized version with a neutral avatar and voice.' : 'Reviewers see your real face and voice.'}</p>
          </div>
        </section>
        <section class="card">
          <div class="card-header"><div><h2 class="card-title">Next steps</h2></div></div>
          <div class="card-body">
            <ul class="checklist">
              ${renderCheck(true, 'Pitch received')}
              ${renderCheck(!isProcessing, 'Captions and anonymized version ready')}
              ${renderCheck(Boolean(manuscript.decision), 'Editor makes a first decision')}
            </ul>
            <a class="btn btn-secondary" href="#author-feedback">${icon('message-square-text')}Open Author Feedback</a>
          </div>
        </section>
      </div>
    </div>`
}

function renderStudioWorkspace(manuscript, isRepitch) {
  const settings = appState.settings
  const isDoubleBlind = settings.reviewModel === 'double-blind'
  const limit = settings.limits.authorPitchSeconds
  const flags = slideFlags()
  const scriptTerms = isDoubleBlind ? findIdentifyingTerms(studio.script) : []
  const identity = computeIdentity({ isLive: studio.source === 'live' && studio.mode !== 'script', email: authorSession.email, orcidKey: authorSession.orcidKey })
  const isReady = studio.mode === 'script' ? studio.script.trim().length > 0 && studio.slides.length > 0 : Boolean(studio.recording)

  return `
    ${isRepitch ? renderRepitchBanner(manuscript) : ''}
    ${studio.recoverableDraft && !studio.recording ? `
      <div class="banner banner-warning">
        ${icon('history')}
        <div class="banner-body">
          <p class="banner-title">We found an unsaved recording</p>
          <p>${formatSeconds(studio.recoverableDraft.durationSec)} recorded ${formatDateTime(studio.recoverableDraft.savedAt)} before the page closed.</p>
          <div class="note-actions">
            <button type="button" class="btn btn-secondary btn-sm" data-action="recover-draft">${icon('rotate-ccw')}Recover recording</button>
            <button type="button" class="btn btn-ghost btn-sm" data-action="discard-draft">Discard</button>
          </div>
        </div>
      </div>` : ''}
    <div class="studio-grid">
      <div class="stack">
        <section class="card">
          <div class="tabs" role="tablist" aria-label="Pitch source">
            <button type="button" class="tab" role="tab" aria-selected="${studio.tab === 'record'}" data-action="set-tab" data-value="record" ${isBusy() ? 'disabled' : ''}>${icon('circle-dot')}Record</button>
            <button type="button" class="tab" role="tab" aria-selected="${studio.tab === 'upload'}" data-action="set-tab" data-value="upload" ${isBusy() ? 'disabled' : ''}>${icon('upload')}Upload video</button>
          </div>
          <div class="card-body">
            ${studio.tab === 'record' ? renderRecordPanel(limit, isDoubleBlind) : renderUploadPanel(limit)}
          </div>
        </section>
        ${renderSlidesCard(flags, isDoubleBlind)}
      </div>

      <div class="stack">
        <section class="card">
          <div class="card-header"><div><h2 class="card-title">Script</h2><p class="card-sub">${studio.mode === 'script' ? 'This text is read aloud with your slides.' : 'Shown near the camera while you record. Not recorded.'}</p></div></div>
          <div class="card-body">
            <div class="field">
              <label class="field-label" for="template-select">Pitch template</label>
              <select class="select" id="template-select" data-action="set-template">
                ${PITCH_TEMPLATES.map((template) => `<option value="${template.id}" ${template.id === studio.templateId ? 'selected' : ''}>${template.label}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="script-input">Your words</label>
              <textarea class="textarea" id="script-input" data-action="edit-script" ${isBusy() ? 'disabled' : ''}>${escapeHtml(studio.script)}</textarea>
              <span class="field-hint" id="script-hint">${wordCount(studio.script)} words · about ${formatSeconds(estimateScriptSeconds(studio.script))} spoken</span>
            </div>
            ${scriptTerms.length ? `<div class="note note-warning">${icon('alert-triangle')}<span>Your script may identify you: <strong>${scriptTerms.map(escapeHtml).join(', ')}</strong>. Double-blind reviewers should not learn who you are.</span></div>` : ''}
            ${studio.mode === 'script' ? `<button type="button" class="btn btn-secondary" data-action="play-script" ${studio.script.trim() ? '' : 'disabled'}>${icon('volume-2')}Listen to the script</button>` : ''}
          </div>
        </section>

        ${isDoubleBlind ? renderDoubleBlindCard() : renderAppearanceCard()}

        <section class="card">
          <div class="card-header"><div><h2 class="card-title">Identity check</h2><p class="card-sub">Shown to the editor with your pitch.</p></div></div>
          <div class="card-body">
            ${renderIdentityBadge(identity)}
            ${identity.badge === 'amber' && studio.source === 'live' && studio.mode !== 'script' ? '<p class="card-sub">Use an institutional email, or an ORCID record with at least 2 trusted works, to get the green badge.</p>' : ''}
          </div>
        </section>

        <section class="card">
          <div class="card-header"><div><h2 class="card-title">Before you submit</h2></div></div>
          <div class="card-body">
            <ul class="checklist">
              ${renderCheck(true, 'Signed in with ORCID and gave consent')}
              ${renderCheck(isReady, studio.mode === 'script' ? 'Script and slides ready' : `Recording ready (${formatSeconds(studio.durationSec)} of ${formatSeconds(limit)})`)}
              ${renderCheck(studio.slides.length > 0, studio.slides.length ? `${studio.slides.length} slides added` : 'Slides added (optional)', !studio.slides.length && studio.mode !== 'script')}
              ${isDoubleBlind ? renderCheck(flags.length === 0 && scriptTerms.length === 0, flags.length || scriptTerms.length ? 'Possible identifying details to review' : 'No identifying details found', flags.length > 0 || scriptTerms.length > 0) : ''}
            </ul>
            <button type="button" class="btn btn-primary btn-lg" data-action="open-preview" ${isReady && !isBusy() ? '' : 'disabled'}>${icon('send')}Preview and submit</button>
          </div>
        </section>
      </div>
    </div>`
}

function renderCheck(isDone, label, isWarning = false) {
  const state = isDone ? 'check-done' : isWarning ? 'check-warn' : 'check-todo'
  const iconName = isDone ? 'check-circle-2' : isWarning ? 'alert-circle' : 'circle'
  return `<li class="check-item ${state}">${icon(iconName)}<span>${escapeHtml(label)}</span></li>`
}

function renderRepitchBanner(manuscript) {
  const daysLeft = Math.max(0, daysUntil(manuscript.repitchDeadline))
  return `
    <div class="banner banner-warning">
      ${icon('repeat')}
      <div class="banner-body">
        <p class="banner-title">The editor asked for a new pitch · due ${formatDate(manuscript.repitchDeadline)} (${daysLeft} days left)</p>
        ${manuscript.editorNote?.text ? `<p>“${escapeHtml(manuscript.editorNote.text)}”</p>` : ''}
        ${manuscript.editorNote?.hasVideo ? '<p>The editor also left a video note. Open Author Feedback to watch it.</p>' : ''}
        <p>This is your only re-pitch for this manuscript.</p>
      </div>
    </div>`
}

function renderMicMeter() {
  return `
    <div class="meter">
      <span class="field-label">Microphone level</span>
      <div class="meter-track" id="mic-meter" aria-hidden="true">${Array.from({ length: METER_SEGMENTS }, () => '<span></span>').join('')}</div>
    </div>`

function renderDeviceBar() {
  if (!studio.stream || studio.isSimulated) return ''
  const deviceOptions = (devices, selectedId, fallback) => devices.length
    ? devices.map((device, index) => `<option value="${escapeHtml(device.deviceId)}" ${device.deviceId === selectedId ? 'selected' : ''}>${escapeHtml(device.label || `${fallback} ${index + 1}`)}</option>`).join('')
    : `<option>${fallback}</option>`
  return `
    <div class="device-bar ${studio.mode === 'audio' ? 'is-audio' : ''}">
      ${studio.mode === 'video' ? `
        <div class="field">
          <label class="field-label" for="camera-select">Camera</label>
          <select class="select" id="camera-select" data-action="select-camera" ${isBusy() ? 'disabled' : ''}>${deviceOptions(studio.devices.cameras, studio.cameraId, 'Camera')}</select>
        </div>` : ''}
      <div class="field">
        <label class="field-label" for="microphone-select">Microphone</label>
        <select class="select" id="microphone-select" data-action="select-microphone" ${isBusy() ? 'disabled' : ''}>${deviceOptions(studio.devices.microphones, studio.microphoneId, 'Microphone')}</select>

}

function renderRecordPanel(limit, isDoubleBlind) {

        </div>` : ''}
    </div>

      <div class="progress" aria-hidden="true"><span id="rec-progress" style="width:${Math.min(100, (elapsed / limit) * 100)}%"></span></div>
      <div class="controls">

            <button type="button" class="btn btn-record" data-action="stop-recording">${icon('square')}Stop</button>
            <button type="button" class="btn btn-secondary" data-action="next-slide" ${studio.slideIndex < studio.slides.length - 1 ? '' : 'disabled'}>${icon('chevron-right')}Next slide</button>` : studio.recording && studio.source === 'live' ? `
            <button type="button" class="btn btn-secondary" data-action="record-again">${icon('rotate-ccw')}Record again</button>` : `
            <button type="button" class="btn btn-record" data-action="start-countdown" ${studio.stream && !studio.countdown ? '' : 'disabled'}>${icon('circle')}Start recording</button>`}
          <span class="timer"><span id="rec-timer">${formatSeconds(elapsed)}</span> / ${formatSeconds(limit)}</span>

          <label class="switch"><input type="checkbox" data-action="toggle-teleprompter" ${studio.showTeleprompter ? 'checked' : ''}>Teleprompter</label>
          ${isDoubleBlind && studio.mode === 'video' ? `<label class="switch"><input type="checkbox" data-action="toggle-anonymized" ${studio.showAnonymizedPreview ? 'checked' : ''}>Preview as reviewers see it</label>` : ''}
        </div>
      </div>`}`
}

function renderStage(isDoubleBlind) {
  const currentSlide = studio.slides[studio.slideIndex]

  if (studio.mode === 'script') {
    return `<div class="stage">${currentSlide ? `
      <div class="stage-slide">
        <span class="slide-num">Slide ${studio.slideIndex + 1} of ${studio.slides.length}</span>
        <span class="slide-title">${escapeHtml(currentSlide.title)}</span>
        <span class="slide-text">${escapeHtml(currentSlide.text)}</span>
      </div>` : `<div class="stage-empty">${icon('presentation')}<p>Add slides below. Your written script is read aloud with them, so no camera or microphone is needed.</p></div>`}</div>`
  }

  if (studio.recording && !studio.isRecording && studio.source === 'live') {
    return `<div class="stage"><video id="review-video" class="is-contained" controls playsinline src="${studio.recordingUrl}"></video></div>`
  }

  if (!studio.stream) {
    return `
      <div class="stage">
        <div class="stage-empty">
          ${icon(studio.mode === 'audio' ? 'mic' : 'video')}
          <p>${studio.mode === 'audio' ? 'Turn on your microphone. Your voice is recorded with your slides and a live waveform.' : 'Turn on your camera and microphone. Nothing is recorded until you press Start.'}</p>
          <button type="button" class="btn btn-primary" data-action="start-media">${icon('power')}Turn on ${studio.mode === 'audio' ? 'microphone' : 'camera and microphone'}</button>
          ${studio.mediaError ? `<p>${escapeHtml(studio.mediaError)}</p><div class="row" style="justify-content:center"><button type="button" class="btn btn-secondary btn-sm" data-action="start-simulated">${icon('monitor-play')}Use simulated camera</button><button type="button" class="btn btn-secondary btn-sm" data-action="set-tab" data-value="upload">${icon('upload')}Upload a video</button></div>` : ''}
        </div>
      </div>`
  }

  const showAvatar = shouldPreviewAvatar()
  const scriptVisible = studio.showTeleprompter && studio.script.trim()
  return `
    <div class="stage">
      <canvas id="stage-canvas" width="${SCENE_WIDTH}" height="${SCENE_HEIGHT}" aria-label="Live preview"></canvas>
      <div class="stage-overlay-top">
        <span>${studio.isRecording ? '<span class="pill"><span class="rec-dot"></span>Recording</span>' : `<span class="pill">${studio.isSimulated ? 'Simulated camera' : 'Live preview'}</span>`}</span>
        ${showAvatar && studio.mode === 'video' ? `<span class="pill">${icon('venetian-mask')}${isDoubleBlind ? 'Neutral avatar preview' : 'Avatar'}</span>` : ''}
      </div>
      ${scriptVisible ? `<div class="teleprompter"><div class="teleprompter-text" id="teleprompter-text">${escapeHtml(studio.script)}</div></div>` : ''}
      ${studio.isRecording && isDoubleBlind ? `<div class="stage-warning">${icon('alert-triangle')}Don’t mention your institution, lab, grants or past papers.</div>` : ''}
      ${studio.countdown > 0 ? `
        <div class="countdown" role="status" aria-live="assertive">
          <span class="countdown-number" id="countdown-number">${studio.countdown}</span>
          <button type="button" class="btn btn-secondary btn-sm" data-action="cancel-countdown">Cancel</button>
        </div>` : ''}
    </div>`
}

function renderUploadPanel(limit) {

      <div class="stage"><video id="review-video" class="is-contained" controls playsinline src="${studio.recordingUrl}"></video></div>
      <div class="controls">
        <span class="card-sub">${escapeHtml(studio.uploadName)} · ${formatSeconds(studio.durationSec)}</span>

}

function renderDoubleBlindCard() {
  return `
    <section class="card">
      <div class="card-header"><div><h2 class="card-title">Double-blind protection</h2><p class="card-sub">Required by this journal.</p></div></div>

function renderAppearanceCard() {
  return `
    <section class="card">
      <div class="card-header"><div><h2 class="card-title">Appearance</h2><p class="card-sub">This journal shows authors’ real faces. A scholar avatar is optional.</p></div></div>
      <div class="card-body">
        <div class="persona-grid" role="radiogroup" aria-label="Appearance">
          ${PERSONAS.map((persona) => `
            <button type="button" class="persona" role="radio" aria-checked="${studio.persona === persona.id}" data-action="set-persona" data-value="${persona.id}">
              ${persona.color ? `<img src="${avatarDataUrl(persona.color)}" alt="">` : `<span class="persona-real">${icon('user')}</span>`}${persona.label}
            </button>`).join('')}
        </div>
      </div>
    </section>`
}

function shouldPreviewAvatar() {
  if (studio.mode === 'audio') return true
  if (appState.settings.reviewModel === 'double-blind') return studio.showAnonymizedPreview
  return studio.persona !== 'real'
}

function shouldRecordAvatar() {
  if (studio.mode === 'audio') return true
  if (appState.settings.reviewModel === 'double-blind') return false
  return studio.persona !== 'real'
}

function avatarColor() {
  if (appState.settings.reviewModel === 'double-blind' || studio.mode === 'audio') return NEUTRAL_AVATAR_COLOR
  return PERSONAS.find((persona) => persona.id === studio.persona)?.color ?? NEUTRAL_AVATAR_COLOR
}

function effectiveLayout() {
  if (studio.mode === 'audio') return studio.slides.length ? 'slide-focus' : 'voice'
  if (!studio.slides.length) return 'presenter'
  return studio.layout
}

function wrapText(context, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(/\s+/)
  let line = ''
  let lineIndex = 0
  for (let index = 0; index < words.length; index += 1) {
    const candidate = line ? `${line} ${words[index]}` : words[index]
    if (context.measureText(candidate).width > maxWidth && line) {
      context.fillText(lineIndex === maxLines - 1 ? `${line}…` : line, x, y + lineIndex * lineHeight)
      lineIndex += 1
      line = words[index]
      if (lineIndex >= maxLines) return
    } else {
      line = candidate
    }
  }
  if (line) context.fillText(line, x, y + lineIndex * lineHeight)
}

function drawSlide(context, slide, index, total, x, y, width, height) {
  if (!slide) return
  const scale = width / 1200
  context.save()
  context.fillStyle = '#ffffff'
  context.beginPath()
  context.roundRect(x, y, width, height, 14 * scale)
  context.fill()
  context.fillStyle = '#6b7280'
  context.font = `600 ${Math.round(18 * scale)}px Inter, sans-serif`
  context.fillText(`${index + 1} / ${total}`, x + 56 * scale, y + 64 * scale)
  context.fillStyle = '#111827'
  context.font = `700 ${Math.round(52 * scale)}px Inter, sans-serif`
  wrapText(context, slide.title, x + 56 * scale, y + 150 * scale, width - 112 * scale, 64 * scale, 2)
  context.fillStyle = '#4b5563'
  context.font = `400 ${Math.round(32 * scale)}px Inter, sans-serif`
  wrapText(context, slide.text, x + 56 * scale, y + 300 * scale, width - 112 * scale, 46 * scale, 4)
  context.restore()
}

function drawVideoCover(context, video, x, y, width, height, isMirrored) {
  if (!video || !video.videoWidth) {
    context.fillStyle = cssValue('--stage-panel')
    context.fillRect(x, y, width, height)
    return
  }
  const scale = Math.max(width / video.videoWidth, height / video.videoHeight)
  const sourceWidth = width / scale
  const sourceHeight = height / scale
  const sourceX = (video.videoWidth - sourceWidth) / 2
  const sourceY = (video.videoHeight - sourceHeight) / 2
  context.save()
  if (isMirrored) {
    context.translate(x + width, y)
    context.scale(-1, 1)
    context.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, width, height)
  } else {
    context.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, x, y, width, height)
  }
  context.restore()
}

function drawAvatar(context, centerX, centerY, radius, level, color) {
  const image = getAvatarImage(color)
  context.save()
  context.globalAlpha = 0.18 + level * 0.45
  context.fillStyle = cssValue('--brand-300')
  context.beginPath()
  context.arc(centerX, centerY, radius * (1.08 + level * 0.14), 0, Math.PI * 2)
  context.fill()
  context.globalAlpha = 1
  const size = radius * 2 * (1 + level * 0.03)
  if (image.complete) context.drawImage(image, centerX - size / 2, centerY - size / 2, size, size)
  context.restore()
}

function drawPresenterArea(context, x, y, width, height, options) {
  context.save()
  context.beginPath()
  context.roundRect(x, y, width, height, 14)
  context.clip()
  if (options.showAvatar) {
    context.fillStyle = cssValue('--stage-panel')
    context.fillRect(x, y, width, height)
    drawAvatar(context, x + width / 2, y + height / 2, Math.min(width, height) * 0.28, options.level, options.color)
  } else {
    drawVideoCover(context, studio.cameraVideo, x, y, width, height, options.isMirrored)
  }
  context.restore()
}

function drawPresenterBubble(context, centerX, centerY, radius, options) {
  context.save()
  context.beginPath()
  context.arc(centerX, centerY, radius + 6, 0, Math.PI * 2)
  context.fillStyle = '#ffffff'
  context.fill()
  context.beginPath()
  context.arc(centerX, centerY, radius, 0, Math.PI * 2)
  context.clip()
  if (options.showAvatar) {
    context.fillStyle = cssValue('--stage-panel')
    context.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2)
    drawAvatar(context, centerX, centerY, radius * 0.72, options.level, options.color)
  } else {
    drawVideoCover(context, studio.cameraVideo, centerX - radius, centerY - radius, radius * 2, radius * 2, options.isMirrored)
  }
  context.restore()
}

function drawWaveform(context, x, y, width, height, analyser) {
  const barCount = 64
  const data = new Uint8Array(analyser ? analyser.frequencyBinCount : barCount)
  if (analyser) analyser.getByteFrequencyData(data)
  const gap = 4
  const barWidth = (width - gap * (barCount - 1)) / barCount
  context.save()
  context.fillStyle = cssValue('--brand-300')
  for (let index = 0; index < barCount; index += 1) {
    const value = data[Math.floor((index / barCount) * data.length * 0.7)] / 255
    const barHeight = Math.max(6, value * height)
    context.beginPath()
    context.roundRect(x + index * (barWidth + gap), y + (height - barHeight) / 2, barWidth, barHeight, barWidth / 2)
    context.fill()
  }
  context.restore()
}

function drawScene(context, options) {
  const slide = studio.slides[studio.slideIndex]
  const total = studio.slides.length
  context.fillStyle = cssValue('--stage-bg')
  context.fillRect(0, 0, SCENE_WIDTH, SCENE_HEIGHT)
  const layout = effectiveLayout()
  if (layout === 'presenter') {
    drawPresenterArea(context, 0, 0, SCENE_WIDTH, SCENE_HEIGHT, options)
  } else if (layout === 'side-by-side') {
    drawPresenterArea(context, 32, 32, 464, 656, options)
    drawSlide(context, slide, studio.slideIndex, total, 528, 112, 720, 496)
  } else if (layout === 'bubble') {
    drawSlide(context, slide, studio.slideIndex, total, 40, 40, 1200, 640)
    drawPresenterBubble(context, 1112, 572, 112, options)
  } else if (layout === 'slide-focus') {
    drawSlide(context, slide, studio.slideIndex, total, 40, 32, 1200, 572)
    drawWaveform(context, 160, 624, 960, 72, studio.analyser)
  } else {
    drawAvatar(context, SCENE_WIDTH / 2, 300, 150, options.level, options.color)
    drawWaveform(context, 240, 540, 800, 110, studio.analyser)
  }
}

function updateMicMeter(level) {
  const meter = document.getElementById('mic-meter')
  if (!meter) return
  const active = Math.round(level * METER_SEGMENTS)
  ;[...meter.children].forEach((segment, index) => {
    segment.className = index < active ? (index >= METER_SEGMENTS - 2 ? 'is-clip' : index >= METER_SEGMENTS - 6 ? 'is-hot' : 'is-on') : ''
  })
}

function startStageLoop() {
  cancelAnimationFrame(studio.animationId)
  const tick = () => {
    studio.smoothedLevel = studio.smoothedLevel * 0.75 + readAudioLevel() * 0.25
    const level = studio.smoothedLevel
    const stageCanvas = document.getElementById('stage-canvas')
    if (stageCanvas) drawScene(stageCanvas.getContext('2d'), { showAvatar: shouldPreviewAvatar(), isMirrored: true, level, color: avatarColor() })
    if (studio.isRecording && studio.recordCanvas) drawScene(studio.recordCanvas.getContext('2d'), { showAvatar: shouldRecordAvatar(), isMirrored: false, level, color: avatarColor() })
    updateMicMeter(level)
    studio.animationId = requestAnimationFrame(tick)
  }
  tick()
}

function renderPlaceholderView(view) {
  return `
    ${renderPageHeader({ eyebrow: `${ROLES.find((role) => role.id === view.role).label} view`, title: view.label, lead: 'This page is designed in the next part of the build.', release: view.release })}
    <section class="card"><div class="placeholder">${icon('hammer')}<p>Coming in the next part.</p></div></section>`
}

function afterRenderAuthorStudio() {
  if (studio.stream && !studio.animationId) startStageLoop()
  const submittedStage = document.getElementById('submitted-stage')
  if (submittedStage) attachStoredVideo(submittedStage, `video:${authorUi.manuscriptId}`)
}

async function attachStoredVideo(container, key) {
  const stored = await mediaDb.get(key)
  if (!stored?.blob || !document.body.contains(container)) return
  container.innerHTML = `<video class="is-contained" controls playsinline src="${URL.createObjectURL(stored.blob)}"></video>`
}

function pickMimeType() {
  const candidates = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
  return candidates.find((type) => window.MediaRecorder?.isTypeSupported?.(type)) ?? ''
}

async function startMedia() {
  studio.mediaError = null
  stopMedia()
  const wantsVideo = studio.mode === 'video'
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: wantsVideo ? { width: { ideal: 1280 }, height: { ideal: 720 }, ...(studio.cameraId ? { deviceId: { exact: studio.cameraId } } : {}) } : false,
      audio: studio.microphoneId ? { deviceId: { exact: studio.microphoneId } } : true,
    })
    await attachStream(stream, false)
    await refreshDevices()
    render()
  } catch (error) {
    studio.mediaError = error?.name === 'NotAllowedError'
      ? 'Camera and microphone are blocked here. Allow access in your browser, use the simulated camera, or upload a video.'
      : 'No camera or microphone is available here. Use the simulated camera or upload a video.'
    render()
  }
}

async function refreshDevices() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices()
    studio.devices = {
      cameras: devices.filter((device) => device.kind === 'videoinput'),
      microphones: devices.filter((device) => device.kind === 'audioinput'),
    }
    studio.cameraId = studio.stream?.getVideoTracks()[0]?.getSettings().deviceId ?? studio.cameraId
    studio.microphoneId = studio.stream?.getAudioTracks()[0]?.getSettings().deviceId ?? studio.microphoneId
  } catch {
    studio.devices = { cameras: [], microphones: [] }
  }
}

async function attachStream(stream, isSimulated) {
  studio.stream = stream
  studio.isSimulated = isSimulated
  const context = getAudioContext()
  if (stream.getAudioTracks().length) {
    const analyser = context.createAnalyser()
    analyser.fftSize = 512
    context.createMediaStreamSource(stream).connect(analyser)
    studio.analyser = analyser
  }
  if (stream.getVideoTracks().length) {
    const video = document.createElement('video')
    video.muted = true
    video.playsInline = true
    video.srcObject = stream
    studio.cameraVideo = video
    try {
      await video.play()
    } catch {
      return
    }
  }
}

async function startSimulatedMedia() {
  stopMedia()
  studio.mediaError = null
  const canvas = document.createElement('canvas')
  canvas.width = SCENE_WIDTH
  canvas.height = SCENE_HEIGHT
  const context = canvas.getContext('2d')
  const token = Symbol('simulated')
  studio.simulatedToken = token
  const startedAt = performance.now()
  const draw = () => {
    if (studio.simulatedToken !== token) return
    const time = (performance.now() - startedAt) / 1000
    const gradient = context.createLinearGradient(0, 0, SCENE_WIDTH, SCENE_HEIGHT)
    gradient.addColorStop(0, '#d4c4ec')
    gradient.addColorStop(1, '#ebe4f5')
    context.fillStyle = gradient
    context.fillRect(0, 0, SCENE_WIDTH, SCENE_HEIGHT)
    const sway = Math.sin(time * 1.1) * 14
    context.fillStyle = '#7854b8'
    context.beginPath()
    context.arc(640 + sway, 290, 96, 0, Math.PI * 2)
    context.fill()
    context.beginPath()
    context.ellipse(640 + sway, 690, 250, 230, 0, Math.PI, 0)
    context.fill()
    requestAnimationFrame(draw)
  }
  draw()
  const stream = canvas.captureStream(30)
  const audio = getAudioContext()
  const destination = audio.createMediaStreamDestination()
  const oscillator = audio.createOscillator()
  const tremolo = audio.createOscillator()
  const gain = audio.createGain()
  const tremoloGain = audio.createGain()
  gain.gain.value = 0.05
  tremoloGain.gain.value = 0.05
  oscillator.frequency.value = 160
  tremolo.frequency.value = 3
  tremolo.connect(tremoloGain).connect(gain.gain)
  oscillator.connect(gain).connect(destination)
  oscillator.start()
  tremolo.start()
  stream.addTrack(destination.stream.getAudioTracks()[0])
  stream.stopSimulated = () => { oscillator.stop(); tremolo.stop() }
  await attachStream(stream, true)
  render()
}

function stopMedia() {
  cancelAnimationFrame(studio.animationId)
  studio.animationId = null
  clearInterval(studio.countdownId)
  studio.countdown = 0
  if (studio.stream) {
    studio.stream.getTracks().forEach((track) => track.stop())
    studio.stream.stopSimulated?.()
  }
  if (studio.cameraVideo) studio.cameraVideo.srcObject = null
  studio.stream = null
  studio.cameraVideo = null
  studio.analyser = null
  studio.simulatedToken = null
}

function readAudioLevel() {
  if (!studio.analyser) return 0
  const data = new Uint8Array(studio.analyser.fftSize)
  studio.analyser.getByteTimeDomainData(data)
  let sum = 0
  for (let index = 0; index < data.length; index += 1) sum += ((data[index] - 128) / 128) ** 2
  return Math.min(1, Math.sqrt(sum / data.length) * 4)
}

function startCountdown() {
  if (!studio.stream) return
  studio.countdown = COUNTDOWN_SECONDS
  render()
  studio.countdownId = setInterval(() => {
    studio.countdown -= 1
    if (studio.countdown <= 0) {
      clearInterval(studio.countdownId)
      studio.countdown = 0
      startRecording()
      return
    }
    const number = document.getElementById('countdown-number')
    if (number) {
      const fresh = number.cloneNode(false)
      fresh.textContent = studio.countdown
      number.replaceWith(fresh)
    }
  }, 1000)
}

function cancelCountdown() {
  clearInterval(studio.countdownId)
  studio.countdown = 0
  render()
}

function startRecording() {
  if (!studio.stream) return
  const recordCanvas = document.createElement('canvas')
  recordCanvas.width = SCENE_WIDTH
  recordCanvas.height = SCENE_HEIGHT
  studio.recordCanvas = recordCanvas
  studio.slideIndex = 0
  drawScene(recordCanvas.getContext('2d'), { showAvatar: shouldRecordAvatar(), isMirrored: false, level: 0, color: avatarColor() })
  const outputStream = recordCanvas.captureStream(30)
  studio.stream.getAudioTracks().forEach((track) => outputStream.addTrack(track))
  const mimeType = pickMimeType()
  const recorder = new MediaRecorder(outputStream, mimeType ? { mimeType } : undefined)
  studio.recorder = recorder
  studio.chunks = []
  studio.slideMarks = studio.slides.length ? [{ slide: 0, atSec: 0 }] : []
  recorder.ondataavailable = (event) => {
    if (!event.data.size) return
    studio.chunks.push(event.data)
    mediaDb.put(draftKey(), { blob: new Blob(studio.chunks, { type: recorder.mimeType }), durationSec: Math.round((Date.now() - studio.startedAt) / 1000), mode: studio.mode, savedAt: new Date().toISOString(), slideMarks: studio.slideMarks })
  }
  recorder.onstop = () => finishRecording(new Blob(studio.chunks, { type: recorder.mimeType }))
  recorder.start(RECORDER_TIMESLICE_MS)
  studio.isRecording = true
  studio.startedAt = Date.now()
  studio.source = 'live'
  studio.recoverableDraft = null
  render()
  studio.timerId = setInterval(tickRecordingTimer, TIMER_TICK_MS)
}

function tickRecordingTimer() {
  const limit = appState.settings.limits.authorPitchSeconds
  const elapsed = (Date.now() - studio.startedAt) / 1000
  const timer = document.getElementById('rec-timer')
  const progress = document.getElementById('rec-progress')
  const teleprompter = document.getElementById('teleprompter-text')
  if (timer) timer.textContent = formatSeconds(elapsed)
  if (progress) progress.style.width = `${Math.min(100, (elapsed / limit) * 100)}%`
  if (teleprompter) {
    const travel = Math.max(0, teleprompter.scrollHeight - teleprompter.parentElement.clientHeight + 20)
    teleprompter.style.transform = `translateY(-${Math.min(travel, (elapsed / Math.max(estimateScriptSeconds(studio.script), 1)) * travel)}px)`
  }
  if (elapsed >= limit) {
    stopRecording()
    showToast('Time limit reached. Recording stopped.', 'timer')
  }
}

function stopRecording() {
  clearInterval(studio.timerId)
  studio.durationSec = Math.min(appState.settings.limits.authorPitchSeconds, Math.round((Date.now() - studio.startedAt) / 1000))
  studio.isRecording = false
  if (studio.recorder?.state === 'recording') studio.recorder.stop()
}

function finishRecording(blob) {
  setRecording(blob)
  stopMedia()
  studio.recordCanvas = null
  render()
}

function setRecording(blob) {
  if (studio.recordingUrl) URL.revokeObjectURL(studio.recordingUrl)
  studio.recording = blob
  studio.recordingUrl = URL.createObjectURL(blob)
}

function resetRecording() {
  clearStudioMedia()
  mediaDb.remove(draftKey())
}

function clearStudioMedia() {
  if (studio.recordingUrl) URL.revokeObjectURL(studio.recordingUrl)
  studio.recording = null
  studio.recordingUrl = null
  studio.durationSec = 0
  studio.slideMarks = []
  studio.uploadName = null
  studio.source = 'live'
}

function handleVideoFile(file) {
  const limits = appState.settings.limits
  if (!file) return
  if (file.size > limits.maxFileMb * 1024 * 1024) {
    showToast(`That file is over ${limits.maxFileMb} MB. Export a smaller version and try again.`, 'alert-circle')
    return
  }
  const probe = document.createElement('video')
  probe.preload = 'metadata'
  probe.onloadedmetadata = () => {
    const durationSec = Math.round(probe.duration)
    URL.revokeObjectURL(probe.src)
    if (Number.isFinite(durationSec) && durationSec > limits.authorPitchSeconds) {
      showToast(`That video is ${formatSeconds(durationSec)}. The limit is ${formatSeconds(limits.authorPitchSeconds)}.`, 'alert-circle')
      return
    }
    resetRecording()
    setRecording(file)
    studio.source = 'upload'
    studio.uploadName = file.name
    studio.durationSec = Number.isFinite(durationSec) ? durationSec : 0
    if (studio.mode === 'script') studio.mode = 'video'
    render()
  }
  probe.onerror = () => showToast('We could not read that video. Use MP4 or WebM.', 'alert-circle')
  probe.src = URL.createObjectURL(file)
}

function speak(text) {
  if (!window.speechSynthesis) {
    showToast('Text-to-speech is not available in this browser.', 'alert-circle')
    return
  }
  window.speechSynthesis.cancel()
  window.speechSynthesis.speak(new SpeechSynthesisUtterance(text))
}

function toggleNeutralVoice(isOn) {
  const video = document.getElementById('preview-video')
  if (!video) return
  const context = getAudioContext()
  if (!neutralVoice || neutralVoice.video !== video) {
    const source = context.createMediaElementSource(video)
    const filter = context.createBiquadFilter()
    filter.type = 'lowpass'
    filter.frequency.value = 2400
    const ringGain = context.createGain()
    ringGain.gain.value = 0
    const oscillator = context.createOscillator()
    oscillator.frequency.value = 55
    oscillator.connect(ringGain.gain)
    oscillator.start()
    filter.connect(ringGain).connect(context.destination)
    neutralVoice = { video, source, filter }
  }
  neutralVoice.source.disconnect()
  neutralVoice.source.connect(isOn ? neutralVoice.filter : context.destination)
}

async function submitPitch() {
  const settings = appState.settings
  const submission = activeSubmission()
  const existing = findManuscript(submission.id)
  const isScript = studio.mode === 'script'
  const isLive = studio.source === 'live' && !isScript
  const submittedAt = new Date().toISOString()
  const pitch = {
    status: 'processing',
    mode: studio.mode,
    source: isScript ? 'script' : studio.source,
    layout: effectiveLayout(),
    durationSec: isScript ? estimateScriptSeconds(studio.script) : studio.durationSec,
    slideCount: studio.slides.length,
    slides: studio.slides,
    slideMarks: studio.slideMarks,
    transcript: studio.script,
    persona: settings.reviewModel === 'double-blind' ? 'neutral' : studio.persona,
    flaggedSlides: slideFlags().map((flag) => flag.index + 1),
    submittedAt,
  }
  const isRepitch = existing?.decision === 'repitch'
  const manuscript = {
    ...(existing ?? {}),
    id: submission.id,
    title: submission.title,
    journal: LAUNCH_CONTEXT.journal,
    articleType: submission.articleType,
    abstract: submission.abstract,
    authorName: LAUNCH_CONTEXT.authorName,
    authorEmail: authorSession.email,
    orcid: ORCID_EXAMPLES[authorSession.orcidKey],
    reviewModel: settings.reviewModel,
    identity: computeIdentity({ isLive, email: authorSession.email, orcidKey: authorSession.orcidKey }),
    pitch,
    pitchVersion: (existing?.pitchVersion ?? 0) + 1,
    repitchCount: existing?.repitchCount ?? 0,
    decision: null,
    repitchDeadline: null,
    shareWithReviewers: existing?.shareWithReviewers ?? settings.includePitchInInvites,
    reviewers: existing?.reviewers ?? [],
    editorNote: isRepitch ? existing.editorNote : null,
    submittedAt: existing?.submittedAt ?? submittedAt,
    history: [...(existing?.history ?? []), { at: submittedAt, event: isRepitch ? 'New pitch submitted after re-pitch request' : 'Pitch submitted' }, ...(pitch.flaggedSlides.length ? [{ at: submittedAt, event: `Author confirmed slide ${pitch.flaggedSlides.join(', ')} has no self-identifying details` }] : [])],
  }
  try {
    await saveManuscript(manuscript)
  } catch {
    showToast('Could not submit. Check your access and try again.', 'alert-circle')
    return
  }
  if (studio.recording) await mediaDb.put(`video:${manuscript.id}`, { blob: studio.recording, savedAt: submittedAt })
  await mediaDb.remove(draftKey())
  closeModal()
  stopMedia()
  render()
  showToast('Pitch submitted. The editor has been notified.')
  setTimeout(async () => {
    const latest = findManuscript(submission.id)
    if (latest?.pitch?.status !== 'processing' || latest.pitch.submittedAt !== submittedAt) return
    await saveManuscript({ ...latest, pitch: { ...latest.pitch, status: 'ready' }, history: [...latest.history, { at: new Date().toISOString(), event: 'Video ready: captions, transcript and anonymized version' }] })
    if (!isBusy()) render()
  }, PROCESSING_DELAY_MS)
}

async function checkForDraft() {
  const draft = await mediaDb.get(draftKey())
  if (!draft?.blob) return
  studio.recoverableDraft = { durationSec: draft.durationSec, savedAt: draft.savedAt }
  if (currentView().id === 'author-studio' && !isBusy()) render()
}
